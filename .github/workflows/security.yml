name: Security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write
  security-events: write

jobs:
  vice-audit:
    name: VICE Security Audit
    runs-on: ubuntu-latest
    env:
      VICE_SKIP_GIT_HISTORY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Run VICE audit
        uses: ./
